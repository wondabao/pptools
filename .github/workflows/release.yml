name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DMG installer
        run: |
          swift --version
          chmod +x scripts/*.sh
          if ! bash -x ./scripts/build-dmg.sh 2>&1 | tee build.log; then
            echo "### ❌ Build DMG Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Create GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh build/
          gh release create ${{ github.ref_name }} build/*.dmg build/*.sha256 --title "${{ github.ref_name }}" --generate-notes || \
          gh release upload ${{ github.ref_name }} build/*.dmg build/*.sha256 --clobber
